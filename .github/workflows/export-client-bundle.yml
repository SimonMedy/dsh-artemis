name: Export client bundle (temporary)

on:
  pull_request:
    paths:
      - "src/client/**"
      - "src/shared/**"
      - "scripts/build-client.mjs"
      - "tsdown.client.config.mjs"
      - ".github/workflows/export-client-bundle.yml"

permissions:
  contents: read

env:
  HARNESS_SHA: c291e7961a515f6d7af9304e7fd1d257929aef26
  PNPM_VERSION: 11.7.0

jobs:
  export-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      chunks: ${{ steps.encode.outputs.chunks }}
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-artemis
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate >/dev/null 2>&1
      - name: Install and build pinned DeepSeek Harness
        working-directory: deepseek-harness
        run: |
          set -e
          pnpm install --frozen-lockfile >"$RUNNER_TEMP/harness-install.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/harness-install.log"
            exit 1
          }
          pnpm run build >"$RUNNER_TEMP/harness-build.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/harness-build.log"
            exit 1
          }
      - name: Rebuild dsh-artemis client bundle
        working-directory: dsh-artemis
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
          DSH_ARTEMIS_CLIENT_OUT_DIR: ${{ github.workspace }}/dsh-artemis/lib
        run: |
          set -e
          npm run bundle:client >"$RUNNER_TEMP/client-build.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/client-build.log"
            exit 1
          }
          node --test test/client-bundle.test.mjs >"$RUNNER_TEMP/client-test.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/client-test.log"
            exit 1
          }
      - name: Encode generated bundle into bounded job-name chunks
        id: encode
        working-directory: dsh-artemis
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          raw = Path("lib/client.js").read_bytes()
          encoded = base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode("ascii")
          size = 180
          chunks = [{"i": index, "data": encoded[offset:offset + size]}
                    for index, offset in enumerate(range(0, len(encoded), size))]
          if len(chunks) > 256:
              raise SystemExit(f"bundle requires too many matrix chunks: {len(chunks)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("chunks=" + json.dumps(chunks, separators=(",", ":")) + "\n")
          PY

  expose-chunks:
    needs: export-bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJSON(needs.export-bundle.outputs.chunks) }}
    name: bundle-chunk-${{ matrix.i }}-${{ matrix.data }}
    steps:
      - run: "true"
