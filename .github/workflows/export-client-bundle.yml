name: Synchronize client bundle (temporary)

on:
  pull_request:
    paths:
      - "src/client/**"
      - "src/shared/**"
      - "scripts/build-client.mjs"
      - "tsdown.client.config.mjs"
      - ".github/workflows/export-client-bundle.yml"

permissions:
  contents: write

env:
  HARNESS_SHA: c291e7961a515f6d7af9304e7fd1d257929aef26
  PNPM_VERSION: 11.7.0

jobs:
  synchronize-bundle:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'gpt/phase-7-sync-client-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dsh-artemis working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          path: dsh-artemis
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate >/dev/null 2>&1
      - name: Install and build pinned DeepSeek Harness
        working-directory: deepseek-harness
        run: |
          set -e
          pnpm install --frozen-lockfile >"$RUNNER_TEMP/harness-install.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/harness-install.log"
            exit 1
          }
          pnpm run build >"$RUNNER_TEMP/harness-build.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/harness-build.log"
            exit 1
          }
      - name: Rebuild and commit only the generated client bundle
        working-directory: dsh-artemis
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
          DSH_ARTEMIS_CLIENT_OUT_DIR: ${{ github.workspace }}/dsh-artemis/lib
        run: |
          set -e
          test "$GITHUB_HEAD_REF" = "gpt/phase-7-sync-client-bundle"
          npm run bundle:client >"$RUNNER_TEMP/client-build.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/client-build.log"
            exit 1
          }
          node --test test/client-bundle.test.mjs
          if git diff --quiet -- lib/client.js; then
            echo "Generated bundle already matches the branch"
            exit 0
          fi
          git status --short
          test "$(git status --short | awk '{print $2}' | grep -vc '^lib/client.js$')" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/client.js
          git commit -m "build: synchronize generated client bundle"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
