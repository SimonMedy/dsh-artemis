name: Temporary v1.0.1 compatibility release prep

on:
  push:
    branches:
      - gpt/release-v1.0.1-harness-alpha1
    paths:
      - .github/workflows/temp-release-v1.0.1.yml
      - scripts/temp-release-v1.0.1.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Repair temporary release helper syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/temp-release-v1.0.1.mjs')
          lines = path.read_text().splitlines()
          lines[110] = "const phase7Addition = phase7Marker + '\\n- [x] PR #119: official DeepSeek Harness `dsh-v0.1.6-alpha.1` pin passes repository CI, real ARTEMIS daemon compatibility, byte-identical client generation, package/Cordis remove/reinstall and Chromium Android-panel E2E without runtime changes.'"
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply v1.0.1 release metadata and docs
        run: node scripts/temp-release-v1.0.1.mjs
      - name: Commit release prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md CHANGELOG.md docs/roadmap.md docs/release-readiness.md
          git commit -m "release: prepare v1.0.1 Harness compatibility patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
