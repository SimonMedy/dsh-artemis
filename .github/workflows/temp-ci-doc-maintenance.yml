name: Temporary roadmap typo fix

on:
  push:
    branches:
      - gpt/phase-7-ci-doc-maintenance
    paths:
      - .github/workflows/temp-ci-doc-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: repo
      - name: Fix roadmap typos and validate
        working-directory: repo
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'docs/roadmap.md'
          let source = fs.readFileSync(path, 'utf8')
          for (const [from, to] of [
            ['public instal, remove and reinstall', 'public install, remove and reinstall'],
            ['pinned DeepSeeek Harness', 'pinned DeepSeek Harness'],
          ]) {
            const count = source.split(from).length - 1
            if (count !== 1) throw new Error(`expected one ${from} occurrence, found ${count}`)
            source = source.replace(from, to)
          }
          fs.writeFileSync(path, source)
          NODE
          npm run check
      - name: Commit corrected roadmap
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          import fs from 'node:fs'
          const api = 'https://api.github.com'
          const path = 'docs/roadmap.md'
          const encodedPath = path.split('/').map(encodeURIComponent).join('/')
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2026-03-10',
          }
          const url = `${api}/repos/${process.env.REPO}/contents/${encodedPath}`
          const get = await fetch(`${url}?ref=${encodeURIComponent(process.env.BRANCH)}`, { headers })
          if (!get.ok) throw new Error(`GET roadmap: ${get.status} ${await get.text()}`)
          const current = await get.json()
          const put = await fetch(url, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: 'docs: correct roadmap wording',
              content: Buffer.from(fs.readFileSync(path, 'utf8')).toString('base64'),
              branch: process.env.BRANCH,
              sha: current.sha,
            }),
          })
          if (!put.ok) throw new Error(`PUT roadmap: ${put.status} ${await put.text()}`)
          NODE
