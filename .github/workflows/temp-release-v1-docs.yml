name: Temporary v1.0.0 release preparation

on:
  push:
    branches:
      - gpt/release-v1.0.0
    paths:
      - .github/workflows/temp-release-v1-docs.yml
      - scripts/temp-release-v1-docs-fixed.mjs

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Apply release documentation guards
        run: node scripts/temp-release-v1-docs-fixed.mjs
      - name: Validate release candidate
        run: npm run check
      - name: Commit release documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md docs/release-readiness.md docs/roadmap.md test/package-archive.test.mjs
          git commit -m "docs: finalize v1.0.0 release policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
