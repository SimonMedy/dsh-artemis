name: TEMP patch Host JSON stream integrity

on:
  push:
    branches:
      - gpt/phase-7-host-json-stream-integrity
    paths:
      - .github/workflows/temp-fix-host-json.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Narrow temporary reader cleanup assertion
        working-directory: dsh-artemis
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const file = '.github/temp/patch-host-json.mjs'
          let source = await readFile(file, 'utf8')
          const before = "replaceOnce('    reader.releaseLock()', '    reader.releaseLock?.()', 'reader release')"
          const after = `replaceOnce(
            lines(['  } finally {', '    reader.releaseLock()', '  }', '  const bytes = new Uint8Array(size)']),
            lines(['  } finally {', '    reader.releaseLock?.()', '  }', '  const bytes = new Uint8Array(size)']),
            'JSON reader release',
          )`
          const count = source.split(before).length - 1
          if (count !== 1) throw new Error(`Expected one temporary reader cleanup assertion, found ${count}`)
          source = source.replace(before, after)
          await writeFile(file, source)
          NODE
      - name: Apply exact Host JSON patch atomically
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: node .github/temp/patch-host-json.mjs
