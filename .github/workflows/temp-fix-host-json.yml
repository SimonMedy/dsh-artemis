name: TEMP patch Host JSON stream integrity

on:
  push:
    branches:
      - gpt/phase-7-host-json-stream-integrity
    paths:
      - .github/workflows/temp-fix-host-json.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Prepare exact Host JSON stream patch
        working-directory: dsh-artemis
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const hostPath = 'src/host/artemis-http.mjs'
          let source = await readFile(hostPath, 'utf8')

          function replaceOnce(before, after, label) {
            const count = source.split(before).length - 1
            if (count !== 1) throw new Error(`Expected exactly one ${label} block, found ${count}`)
            source = source.replace(before, after)
          }

          replaceOnce(
`      const { value, done } = await reader.read()
      if (done) break
      size += value.byteLength
      if (size > maxBytes) {
        await reader.cancel()
        throw new ArtemisProtocolError(\`${endpoint} response exceeded the configured size limit\`, { code: 'response-too-large' })
      }
      chunks.push(value)`,
`      const { value, done } = await reader.read()
      if (done) break
      if (!(value instanceof Uint8Array)) {
        throw new ArtemisProtocolError(\`${endpoint} returned an invalid JSON response body\`, { code: 'invalid-json' })
      }
      size += value.byteLength
      if (size > maxBytes) {
        await reader.cancel().catch(() => {})
        throw new ArtemisProtocolError(\`${endpoint} response exceeded the configured size limit\`, { code: 'response-too-large' })
      }
      chunks.push(value)`,
            'stream accounting',
          )
          replaceOnce('    reader.releaseLock()', '    reader.releaseLock?.()', 'reader release')
          replaceOnce(
            '    return JSON.parse(new TextDecoder().decode(bytes))',
            "    return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes))",
            'JSON decoder',
          )
          await writeFile(hostPath, source)

          const test = `import assert from 'node:assert/strict'
import test from 'node:test'
import { ArtemisHttpClient, ArtemisProtocolError } from '../src/host/artemis-http.mjs'

function headers(contentLength = null) {
  return {
    get(name) {
      const normalized = name.toLowerCase()
      if (normalized === 'content-type') return 'application/json'
      if (normalized === 'content-length') return contentLength
      return null
    },
  }
}

function responseWithReader(reader, contentLength = null) {
  return {
    ok: true,
    status: 200,
    headers: headers(contentLength),
    body: { getReader: () => reader },
  }
}

test('Host JSON reader rejects non-byte stream chunks before size accounting', async () => {
  let released = false
  const reader = {
    reads: 0,
    async read() {
      this.reads += 1
      return this.reads === 1 ? { done: false, value: 'not-bytes' } : { done: true }
    },
    releaseLock() { released = true },
  }
  const client = new ArtemisHttpClient({ fetchImpl: async () => responseWithReader(reader) })
  await assert.rejects(
    client.health(),
    (error) => error instanceof ArtemisProtocolError && error.code === 'invalid-json',
  )
  assert.equal(released, true)
})

test('Host JSON reader preserves response-too-large when cancellation fails', async () => {
  let cancelled = false
  let released = false
  const reader = {
    async read() { return { done: false, value: Uint8Array.from([1, 2, 3, 4, 5]) } },
    async cancel() {
      cancelled = true
      throw new Error('cancel failed')
    },
    releaseLock() { released = true },
  }
  const client = new ArtemisHttpClient({
    maxJsonBytes: 4,
    fetchImpl: async () => responseWithReader(reader),
  })
  await assert.rejects(
    client.health(),
    (error) => error instanceof ArtemisProtocolError && error.code === 'response-too-large',
  )
  assert.equal(cancelled, true)
  assert.equal(released, true)
})

test('Host JSON reader rejects invalid UTF-8 even when replacement decoding would yield valid JSON', async () => {
  const invalidUtf8Json = Uint8Array.from([0x7b, 0x22, 0x78, 0x22, 0x3a, 0x22, 0xff, 0x22, 0x7d])
  const reader = {
    reads: 0,
    async read() {
      this.reads += 1
      return this.reads === 1
        ? { done: false, value: invalidUtf8Json }
        : { done: true, value: undefined }
    },
    releaseLock() {},
  }
  const client = new ArtemisHttpClient({ fetchImpl: async () => responseWithReader(reader) })
  await assert.rejects(
    client.health(),
    (error) => error instanceof ArtemisProtocolError && error.code === 'invalid-json',
  )
})
`
          await writeFile('test/artemis-http-json-stream.test.mjs', test)
          NODE
      - name: Commit patch atomically through GitHub API
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2026-03-10',
            'user-agent': 'dsh-artemis-host-json-fix',
          }
          async function api(path, init = {}) {
            const response = await fetch(`https://api.github.com${path}`, { ...init, headers: { ...headers, ...(init.headers ?? {}) } })
            if (!response.ok) throw new Error(`GitHub API ${init.method ?? 'GET'} ${path} failed with HTTP ${response.status}`)
            return response.status === 204 ? null : response.json()
          }
          const refPath = `/repos/${owner}/${repo}/git/ref/heads/${encodeURIComponent(process.env.TARGET_BRANCH)}`
          const currentRef = await api(refPath)
          if (currentRef.object.sha !== process.env.EXPECTED_PARENT) throw new Error('Working branch moved before atomic Host JSON patch commit')
          const parent = await api(`/repos/${owner}/${repo}/git/commits/${process.env.EXPECTED_PARENT}`)
          const tree = await api(`/repos/${owner}/${repo}/git/trees`, {
            method: 'POST',
            body: JSON.stringify({
              base_tree: parent.tree.sha,
              tree: [
                { path: 'src/host/artemis-http.mjs', mode: '100644', type: 'blob', content: await readFile('src/host/artemis-http.mjs', 'utf8') },
                { path: 'test/artemis-http-json-stream.test.mjs', mode: '100644', type: 'blob', content: await readFile('test/artemis-http-json-stream.test.mjs', 'utf8') },
              ],
            }),
          })
          const commit = await api(`/repos/${owner}/${repo}/git/commits`, {
            method: 'POST',
            body: JSON.stringify({ message: 'fix: harden Host JSON stream integrity', tree: tree.sha, parents: [process.env.EXPECTED_PARENT] }),
          })
          const verifyRef = await api(refPath)
          if (verifyRef.object.sha !== process.env.EXPECTED_PARENT) throw new Error('Working branch moved before Host JSON ref update')
          await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(process.env.TARGET_BRANCH)}`, {
            method: 'PATCH',
            body: JSON.stringify({ sha: commit.sha, force: false }),
          })
          NODE
