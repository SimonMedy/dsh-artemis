name: Temporary evidence latest-step optimization

on:
  push:
    branches: [gpt/phase-7-evidence-latest-step-scan]
    paths:
      - .github/workflows/temp-optimize-evidence-latest-step.yml
      - scripts/temp-optimize-evidence-latest-step.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Apply and validate evidence latest-step optimization
        run: |
          node scripts/temp-optimize-evidence-latest-step.mjs
          git diff --check
          npm run check
      - name: Commit validated permanent changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-evidence.mjs test/evidence.test.mjs docs/trace-evidence.md
          git commit -m "perf: avoid normalizing full evidence history"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$BRANCH"
