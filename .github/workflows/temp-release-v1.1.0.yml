name: Temporary v1.1.0 release prep

on:
  push:
    branches:
      - gpt/release-v1.1.0
    paths:
      - .github/workflows/temp-release-v1.1.0.yml
      - scripts/temp-release-v1.1.0.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Apply v1.1.0 release metadata and docs
        run: node scripts/temp-release-v1.1.0.mjs
      - name: Commit release prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md CHANGELOG.md SECURITY.md docs/release-readiness.md
          git commit -m "release: prepare v1.1.0 ACP session MCP feature"
          git push origin "HEAD:${GITHUB_REF_NAME}"
