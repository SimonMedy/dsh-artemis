name: TEMP patch strict Host Content-Length

on:
  push:
    branches:
      - gpt/phase-7-strict-content-length
    paths:
      - .github/workflows/temp-fix-strict-content-length.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Escape temporary endpoint placeholders in patcher checkout
        working-directory: dsh-artemis
        run: sed -i 's/${endpoint}/\\${endpoint}/g' .github/temp/patch-strict-content-length.mjs
      - name: Apply exact strict Content-Length patch atomically
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: node .github/temp/patch-strict-content-length.mjs
