name: Temporary docs refresh through PR 102

on:
  push:
    branches:
      - gpt/phase-7-docs-through-102
    paths:
      - .github/workflows/temp-docs-through-102.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Refresh docs through PR 102
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/roadmap.md')
          s = p.read_text()
          old = 'hardening merged through PR #100'
          if s.count(old) != 2:
              raise SystemExit(f'roadmap status count: {s.count(old)}')
          s = s.replace(old, 'hardening merged through PR #102')
          marker = '- [x] PR #100: browser snapshot readers cancel acquired readers on read, invalid-chunk and response-size failures, preserve the exact primary error across cancellation/lock cleanup, and the regenerated checked bundle passes full Harness/Cordis/Web/Chromium compatibility.'
          if s.count(marker) != 1:
              raise SystemExit(f'roadmap marker count: {s.count(marker)}')
          extra = marker + '\n- [x] PR #102: the bounded panel adapter now requires `health.reachable` to be an actual boolean, rejecting truthiness coercion and aligning health metadata with the existing strict `device.busy` and `stream.connected` contracts.'
          p.write_text(s.replace(marker, extra))

          p = Path('docs/release-readiness.md')
          s = p.read_text()
          marker = '- Browser snapshot streams apply the same acquired-reader cleanup contract for read, chunk-validation and size-limit failures; cancellation and lock-release cleanup remain best-effort without replacing the primary error, and the checked bundle remains pinned-Harness reproducible.'
          if s.count(marker) != 1:
              raise SystemExit(f'release marker count: {s.count(marker)}')
          extra = marker + '\n- Browser-visible health metadata fails closed on type mismatches: `health.reachable` must be a real boolean at the bounded panel boundary, matching the strict boolean policy already applied to device and stream state fields.'
          p.write_text(s.replace(marker, extra))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md docs/release-readiness.md
          git commit -m "docs: refresh hardening evidence through PR 102"
          git push origin "HEAD:${GITHUB_REF_NAME}"
