name: Temporary Harness v0.1.6-alpha.1 pin update

on:
  push:
    branches:
      - gpt/harness-v0.1.6-alpha.1-compat
    paths:
      - .github/workflows/temp-harness-v0.1.6-alpha.1.yml
      - scripts/temp-patch-harness-v0.1.6-alpha.1.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Prepare coherent Harness tag update
        run: |
          node scripts/temp-patch-harness-v0.1.6-alpha.1.mjs
          cp .github/workflows/harness-compat.yml scripts/temp-harness-compat-next.yml
          git checkout -- .github/workflows/harness-compat.yml
      - name: Commit non-workflow pin update and workflow handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-client.mjs docs/upstreams.md test/upstream-pin-consistency.test.mjs scripts/temp-harness-compat-next.yml
          git commit -m "ci: stage Harness v0.1.6-alpha.1 compatibility pin"
          git push origin "HEAD:${GITHUB_REF_NAME}"
