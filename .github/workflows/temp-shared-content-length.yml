name: TEMP share Content-Length parsing
on:
  push:
    branches:
      - gpt/phase-7-shared-content-length
    paths:
      - .github/workflows/temp-shared-content-length.yml
      - .github/temp/patch-shared-content-length.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Apply shared Content-Length parser atomically
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: node .github/temp/patch-shared-content-length.mjs
