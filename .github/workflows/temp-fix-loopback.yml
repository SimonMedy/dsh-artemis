name: TEMP fix literal loopback regression

on:
  push:
    branches:
      - gpt/phase-7-literal-loopback-regression
    paths:
      - .github/workflows/temp-fix-loopback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Prepare exact security patch
        working-directory: dsh-artemis
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const hostPath = 'src/host/artemis-http.mjs'
          const source = await readFile(hostPath, 'utf8')
          const before = "const LOOPBACK_HOSTS = new Set(['127.0.0.1', 'localhost', '[::1]'])"
          const after = "const LOOPBACK_HOSTS = new Set(['127.0.0.1', '[::1]'])"
          const occurrences = source.split(before).length - 1
          if (occurrences !== 1) throw new Error(`Expected exactly one insecure LOOPBACK_HOSTS declaration, found ${occurrences}`)
          await writeFile(hostPath, source.replace(before, after))

          const test = `import assert from 'node:assert/strict'
          import test from 'node:test'
          import { resolveArtemisBaseUrl } from '../src/host/artemis-http.mjs'

          test('ARTEMIS base URL accepts only literal loopback hosts', () => {
            assert.equal(resolveArtemisBaseUrl('http://127.0.0.1:8000').href, 'http://127.0.0.1:8000/')
            assert.equal(resolveArtemisBaseUrl('http://[::1]:8000').href, 'http://[::1]:8000/')
            for (const value of [
              'http://localhost:8000',
              'http://127.0.0.2:8000',
              'http://example.invalid:8000',
            ]) {
              assert.throws(
                () => resolveArtemisBaseUrl(value),
                (error) => error?.code === 'non-loopback-base-url',
              )
            }
          })
          `
          await writeFile('test/artemis-loopback-security.test.mjs', test)
          NODE
      - name: Commit patch atomically through GitHub API
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2026-03-10',
            'user-agent': 'dsh-artemis-loopback-fix',
          }
          async function api(path, init = {}) {
            const response = await fetch(`https://api.github.com${path}`, { ...init, headers: { ...headers, ...(init.headers ?? {}) } })
            if (!response.ok) throw new Error(`GitHub API ${init.method ?? 'GET'} ${path} failed with HTTP ${response.status}`)
            return response.status === 204 ? null : response.json()
          }

          const refPath = `/repos/${owner}/${repo}/git/ref/heads/${encodeURIComponent(process.env.TARGET_BRANCH)}`
          const currentRef = await api(refPath)
          if (currentRef.object.sha !== process.env.EXPECTED_PARENT) {
            throw new Error('Working branch moved before atomic patch commit')
          }

          const parent = await api(`/repos/${owner}/${repo}/git/commits/${process.env.EXPECTED_PARENT}`)
          const tree = await api(`/repos/${owner}/${repo}/git/trees`, {
            method: 'POST',
            body: JSON.stringify({
              base_tree: parent.tree.sha,
              tree: [
                {
                  path: 'src/host/artemis-http.mjs',
                  mode: '100644',
                  type: 'blob',
                  content: await readFile('src/host/artemis-http.mjs', 'utf8'),
                },
                {
                  path: 'test/artemis-loopback-security.test.mjs',
                  mode: '100644',
                  type: 'blob',
                  content: await readFile('test/artemis-loopback-security.test.mjs', 'utf8'),
                },
              ],
            }),
          })
          const commit = await api(`/repos/${owner}/${repo}/git/commits`, {
            method: 'POST',
            body: JSON.stringify({
              message: 'fix: require literal ARTEMIS loopback hosts',
              tree: tree.sha,
              parents: [process.env.EXPECTED_PARENT],
            }),
          })

          const verifyRef = await api(refPath)
          if (verifyRef.object.sha !== process.env.EXPECTED_PARENT) {
            throw new Error('Working branch moved before ref update')
          }
          await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(process.env.TARGET_BRANCH)}`, {
            method: 'PATCH',
            body: JSON.stringify({ sha: commit.sha, force: false }),
          })
          NODE
