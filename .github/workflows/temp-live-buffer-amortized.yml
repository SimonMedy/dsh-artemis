name: Temporary live buffer amortization patch

on:
  push:
    branches:
      - gpt/phase-7-live-buffer-amortized
    paths:
      - .github/workflows/temp-live-buffer-amortized.yml
      - scripts/temp-fix-live-buffer-amortized.mjs
      - src/host/bounded-byte-buffer.mjs
      - test/bounded-byte-buffer.test.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Apply and validate amortized live buffer patch
        run: |
          node scripts/temp-fix-live-buffer-amortized.mjs
          git diff --check
          npm run check
      - name: Commit validated permanent changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-http.mjs test/artemis-http-live-stream-integrity.test.mjs docs/live-viewer.md
          git commit -m "perf: amortize live stream buffer growth"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$BRANCH"
