name: Temporary JSON reader acquisition cleanup

on:
  push:
    branches:
      - gpt/phase-7-json-reader-acquisition-cleanup
    paths:
      - .github/workflows/temp-json-reader-acquisition-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Patch JSON reader acquisition cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const api = 'https://api.github.com'
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2026-03-10',
          }

          async function request(path, options = {}) {
            const response = await fetch(`${api}${path}`, { headers, ...options })
            const text = await response.text()
            if (!response.ok) throw new Error(`${options.method ?? 'GET'} ${path}: ${response.status} ${text}`)
            return text ? JSON.parse(text) : null
          }

          async function readFile(path) {
            const file = await request(`/repos/${process.env.REPO}/contents/${path}?ref=${encodeURIComponent(process.env.BRANCH)}`)
            return Buffer.from(file.content, 'base64').toString('utf8')
          }

          function replaceExact(source, oldText, newText, label) {
            const count = source.split(oldText).length - 1
            if (count !== 1) throw new Error(`${label}: expected 1 match, found ${count}`)
            return source.replace(oldText, newText)
          }

          const guard = `let reader
          try {
            reader = response.body.getReader()
          } catch (error) {
            await cancelBodyQuietly(response.body)
            throw error
          }`

          let http = await readFile('src/host/artemis-http.mjs')
          http = replaceExact(
            http,
            'const reader = response.body.getReader()',
            guard,
            'Host JSON reader acquisition',
          )

          let evidence = await readFile('src/host/artemis-evidence.mjs')
          evidence = replaceExact(
            evidence,
            'const reader = response.body.getReader()',
            guard,
            'evidence JSON reader acquisition',
          )

          let httpTest = await readFile('test/artemis-http-json-stream.test.mjs')
          const httpMarker = "test('Host JSON reader acquisition failure cancels the unread body and preserves the original error'"
          if (httpTest.includes(httpMarker)) throw new Error('Host acquisition regression already exists')
          httpTest += `

          test('Host JSON reader acquisition failure cancels the unread body and preserves the original error', async () => {
            const readerFailure = new Error('reader acquisition failed')
            let cancelled = false
            const client = new ArtemisHttpClient({
              fetchImpl: async () => ({
                ok: true,
                status: 200,
                headers: headers(),
                body: {
                  getReader() { throw readerFailure },
                  cancel() {
                    cancelled = true
                    return Promise.reject(new Error('cancel failed'))
                  },
                },
              }),
            })

            await assert.rejects(client.health(), (error) => error === readerFailure)
            assert.equal(cancelled, true)
          })
          `

          let evidenceTest = await readFile('test/artemis-evidence-json-stream.test.mjs')
          const evidenceMarker = "test('evidence JSON reader acquisition failure cancels the unread body and preserves the original error'"
          if (evidenceTest.includes(evidenceMarker)) throw new Error('evidence acquisition regression already exists')
          evidenceTest += `

          test('evidence JSON reader acquisition failure cancels the unread body and preserves the original error', async () => {
            const readerFailure = new Error('reader acquisition failed')
            let cancelled = false
            const response = {
              ok: true,
              status: 200,
              headers: headers(),
              body: {
                getReader() { throw readerFailure },
                cancel() {
                  cancelled = true
                  throw new Error('cancel failed')
                },
              },
            }

            await assert.rejects(
              getTaskStatus(evidenceClientWithResponse(response)),
              (error) => error === readerFailure,
            )
            assert.equal(cancelled, true)
          })
          `

          const files = [
            ['src/host/artemis-http.mjs', http],
            ['src/host/artemis-evidence.mjs', evidence],
            ['test/artemis-http-json-stream.test.mjs', httpTest],
            ['test/artemis-evidence-json-stream.test.mjs', evidenceTest],
          ]

          const baseCommit = await request(`/repos/${process.env.REPO}/git/commits/${process.env.BASE_SHA}`)
          const treeEntries = []
          for (const [path, content] of files) {
            const blob = await request(`/repos/${process.env.REPO}/git/blobs`, {
              method: 'POST',
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            })
            treeEntries.push({ path, mode: '100644', type: 'blob', sha: blob.sha })
          }

          const tree = await request(`/repos/${process.env.REPO}/git/trees`, {
            method: 'POST',
            body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: treeEntries }),
          })
          const commit = await request(`/repos/${process.env.REPO}/git/commits`, {
            method: 'POST',
            body: JSON.stringify({
              message: 'fix: clean up JSON reader acquisition failures',
              tree: tree.sha,
              parents: [process.env.BASE_SHA],
            }),
          })

          const refPath = process.env.BRANCH.split('/').map(encodeURIComponent).join('/')
          const current = await request(`/repos/${process.env.REPO}/git/ref/heads/${refPath}`)
          if (current.object.sha !== process.env.BASE_SHA) {
            throw new Error(`branch moved: expected ${process.env.BASE_SHA}, found ${current.object.sha}`)
          }
          await request(`/repos/${process.env.REPO}/git/refs/heads/${refPath}`, {
            method: 'PATCH',
            body: JSON.stringify({ sha: commit.sha, force: false }),
          })
          NODE
