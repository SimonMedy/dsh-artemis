name: Temporary JSON reader formatting fix

on:
  push:
    branches:
      - gpt/phase-7-json-reader-acquisition-cleanup
    paths:
      - .github/workflows/temp-json-reader-acquisition-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fix formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '''  let reader
          try {
            reader = response.body.getReader()
          } catch (error) {
            await cancelBodyQuietly(response.body)
            throw error
          }'''.replace('\n          ', '\n')
          new = '''  let reader
            try {
              reader = response.body.getReader()
            } catch (error) {
              await cancelBodyQuietly(response.body)
              throw error
            }'''.replace('\n          ', '\n  ')
          for name in ('src/host/artemis-http.mjs', 'src/host/artemis-evidence.mjs'):
              p = Path(name)
              text = p.read_text()
              assert text.count(old) == 1, name
              p.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-http.mjs src/host/artemis-evidence.mjs
          git commit -m "style: normalize JSON reader cleanup formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
