name: Temporary license release docs update

on:
  push:
    branches:
      - gpt/phase-7-release-license-gate
    paths:
      - .github/workflows/temp-update-license-release-docs.yml
      - scripts/temp-update-license-release-docs.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Apply and validate release documentation update
        run: |
          node scripts/temp-update-license-release-docs.mjs
          git diff --check
          npm run check
      - name: Commit validated documentation changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-readiness.md docs/roadmap.md
          git commit -m "docs: gate release on licensing decision"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$BRANCH"
