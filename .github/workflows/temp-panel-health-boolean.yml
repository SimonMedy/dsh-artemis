name: Temporary panel health boolean hardening

on:
  push:
    branches:
      - gpt/phase-7-panel-health-boolean
    paths:
      - .github/workflows/temp-panel-health-boolean.yml
      - scripts/temp-patch-panel-health.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Harden panel health boolean
        run: |
          node scripts/temp-patch-panel-health.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/panel-client-bounds.mjs test/panel-client-bounds.test.mjs
          git commit -m "fix: reject malformed panel health booleans"
          git push origin "HEAD:${GITHUB_REF_NAME}"
