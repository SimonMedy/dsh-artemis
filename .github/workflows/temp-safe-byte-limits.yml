name: Temporary safe byte limits hardening

on:
  push:
    branches:
      - gpt/phase-7-safe-byte-limits
    paths:
      - .github/workflows/temp-safe-byte-limits.yml
      - scripts/temp-patch-safe-byte-limits.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Harden byte limit arithmetic
        run: |
          node scripts/temp-patch-safe-byte-limits.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-http.mjs src/host/artemis-evidence.mjs test/artemis-http.test.mjs test/artemis-evidence-json-stream.test.mjs
          git commit -m "fix: require safe Host byte limits"
          git push origin "HEAD:${GITHUB_REF_NAME}"
