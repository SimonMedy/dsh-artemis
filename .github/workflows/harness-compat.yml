name: Harness compatibility
on:
  pull_request:
    paths:
      - "package.json"
      - "cordis.patch.yml"
      - "src/**"
      - "lib/client.js"
      - "scripts/**"
      - "tsdown.client.config.mjs"
      - "test/e2e/**"
      - "test/fixtures/**"
      - "docs/upstreams.md"
      - ".github/workflows/harness-compat.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  HARNESS_SHA: c291e7961a515f6d7af9304e7fd1d257929aef26
  PNPM_VERSION: 11.7.0
jobs:
  install-compose-and-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version
      - name: Install and build pinned Harness
        working-directory: deepseek-harness
        run: |
          run_quiet() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/${name}.log"
            if ! "$@" > "$log" 2>&1; then
              echo "::error title=${name} failed::Raw upstream output suppressed; see bounded summary"
              node "$GITHUB_WORKSPACE/dsh-artemis/scripts/summarize-harness-log.mjs" "$log" build
              exit 1
            fi
          }
          run_quiet harness-install pnpm install --frozen-lockfile
          run_quiet harness-build pnpm run build
          pnpm dsh --version
      - name: Verify checked-in browser client matches pinned DeepSeek Harness build
        working-directory: dsh-artemis
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
          DSH_ARTEMIS_CLIENT_OUT_DIR: ${{ runner.temp }}/dsh-artemis-client-build
        run: |
          rm -rf "$DSH_ARTEMIS_CLIENT_OUT_DIR"
          npm run bundle:client
          test -f "$DSH_ARTEMIS_CLIENT_OUT_DIR/client.js"
          if ! cmp -s "$DSH_ARTEMIS_CLIENT_OUT_DIR/client.js" lib/client.js; then
            echo "::error title=Generated client bundle drift::lib/client.js does not match the pinned DeepSeek Harness build. Rebuild and commit the generated bundle."
            exit 1
          fi
          node --test test/client-bundle.test.mjs
          grep -F 'window.__ModuleLoader__.load' lib/client.js
          grep -F '/dsh-artemis/v1/snapshot' lib/client.js
          grep -F 'Capture Android screen' lib/client.js
          grep -F 'Visual QA checkpoint' lib/client.js
          grep -F 'response size limit' lib/client.js
      - name: Pack dsh-artemis as a distribution artifact
        id: pack
        working-directory: dsh-artemis
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-artemis-pack"
          npm pack --pack-destination "$RUNNER_TEMP/dsh-artemis-pack" >/tmp/dsh-artemis-pack-name.txt
          TARBALL="$RUNNER_TEMP/dsh-artemis-pack/$(tail -n 1 /tmp/dsh-artemis-pack-name.txt)"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          tar -tzf "$TARBALL" | grep -F 'package/cordis.patch.yml'
          tar -tzf "$TARBALL" | grep -F 'package/src/index.mjs'
          tar -tzf "$TARBALL" | grep -F 'package/lib/client.js'
          tar -tzf "$TARBALL" | grep -F 'package/src/integration/rules-skill-plugin.mjs'
          tar -xOzf "$TARBALL" package/lib/client.js | grep -F 'window.__ModuleLoader__.load'
          tar -xOzf "$TARBALL" package/lib/client.js | grep -F '/dsh-artemis/v1/snapshot'
      - name: Install package into an isolated Harness web profile
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          ARTEMIS_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          pnpm dsh plugin --profile web add "$ARTEMIS_TARBALL"
          test -f "$DSH_HOME/profiles/web/package.json"
          node -e "const p=require(process.env.DSH_HOME+'/profiles/web/package.json'); if (!p.dependencies?.['dsh-artemis']) process.exit(1)"
      - name: Resolve rules-skill package subpath from the installed profile
        working-directory: ${{ runner.temp }}/dsh-home/profiles/web
        run: |
          node --input-type=module -e "const m=await import('dsh-artemis/rules-skill'); if(m.name!=='dsh-artemis-rules-skill'||JSON.stringify(m.inject)!=='[\"skills\"]') process.exit(1)"
      - name: Verify composed Cordis tree contains dsh-artemis
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dsh web --dump-config > "$RUNNER_TEMP/dsh-web-config.yml"
          grep -F 'id: dsh-artemis' "$RUNNER_TEMP/dsh-web-config.yml"
          grep -F 'dsh-artemis' "$RUNNER_TEMP/dsh-web-config.yml"
      - name: Remove dsh-artemis through the public Harness plugin CLI
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dsh plugin --profile web remove dsh-artemis
          node -e "const p=require(process.env.DSH_HOME+'/profiles/web/package.json'); if (p.dependencies?.['dsh-artemis']) process.exit(1); if (p.dsh?.profile?.bundles?.includes('dsh-artemis')) process.exit(2)"
          pnpm dsh web --dump-config > "$RUNNER_TEMP/dsh-web-without-artemis.yml"
          test -s "$RUNNER_TEMP/dsh-web-without-artemis.yml"
          if grep -Fq 'dsh-artemis' "$RUNNER_TEMP/dsh-web-without-artemis.yml"; then
            echo "::error title=dsh-artemis removal left Cordis state::Removed plugin still appears in composed Harness config"
            exit 1
          fi
      - name: Reinstall dsh-artemis and verify profile reconciliation
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          ARTEMIS_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          pnpm dsh plugin --profile web add "$ARTEMIS_TARBALL"
          node -e "const p=require(process.env.DSH_HOME+'/profiles/web/package.json'); if (!p.dependencies?.['dsh-artemis']) process.exit(1); if (!p.dsh?.profile?.bundles?.includes('dsh-artemis')) process.exit(2)"
          pnpm dsh web --dump-config > "$RUNNER_TEMP/dsh-web-reinstalled.yml"
          grep -F 'id: dsh-artemis' "$RUNNER_TEMP/dsh-web-reinstalled.yml"
          grep -F 'dsh-artemis' "$RUNNER_TEMP/dsh-web-reinstalled.yml"
      - name: Install Chromium for the Harness Playwright runtime
        working-directory: deepseek-harness/apps/web
        run: pnpm exec playwright install chromium
      - name: Start deterministic local test services
        run: |
          node dsh-artemis/test/fixtures/fake-artemis.mjs > "$RUNNER_TEMP/fake-artemis.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-artemis.pid"
          node dsh-artemis/test/fixtures/fake-deepseek.mjs > "$RUNNER_TEMP/fake-deepseek.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-deepseek.pid"
          for _ in $(seq 1 40); do
            ARTEMIS_READY=0
            DEEPSEEK_READY=0
            curl --fail --silent http://127.0.0.1:8000/api/status >/dev/null && ARTEMIS_READY=1 || true
            curl --fail --silent http://127.0.0.1:8001/health >/dev/null && DEEPSEEK_READY=1 || true
            if [ "$ARTEMIS_READY" -eq 1 ] && [ "$DEEPSEEK_READY" -eq 1 ]; then exit 0; fi
            sleep 0.25
          done
          echo "Local test services failed to start" >&2
          exit 1
      - name: Start authenticated Harness Web
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          fail_start() {
            local log="$1"
            echo "::error title=Harness Web failed to start::Raw upstream output suppressed; see bounded summary"
            node "$GITHUB_WORKSPACE/dsh-artemis/scripts/summarize-harness-log.mjs" "$log" web
            return 1
          }
          is_known_pinned_startup_race() {
            local log="$1"
            grep -Fq 'cannot get property "webServer" without inject' "$log" \
              && grep -Fq 'registerWebCarrier' "$log"
          }
          start_harness() {
            local attempt="$1"
            local log="$RUNNER_TEMP/dsh-web-attempt-${attempt}.log"
            : > "$log"
            pnpm dsh web --no-open --port 3080 > "$log" 2>&1 &
            local pid=$!
            printf '%s' "$pid" > "$RUNNER_TEMP/dsh-web.pid"
            for _ in $(seq 1 120); do
              if grep -qE '^dsh web: http://127\.0\.0\.1:3080/\?token=' "$log"; then
                cp "$log" "$RUNNER_TEMP/dsh-web.log"
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                if [ "$attempt" -eq 1 ] && is_known_pinned_startup_race "$log"; then
                  echo "::warning title=Pinned Harness startup race::Retrying dsh web once after the verified registerWebCarrier/webServer race"
                  return 2
                fi
                fail_start "$log"
                return 1
              fi
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            fail_start "$log"
            return 1
          }
          if start_harness 1; then
            :
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi
            sleep 0.5
            start_harness 2
          fi
          AUTH_URL=$(sed -nE 's#^dsh web: (http://127\.0\.0\.1:3080/\?token=[^[:space:]]+).*#\1#p' "$RUNNER_TEMP/dsh-web.log" | tail -n 1)
          if [ -z "$AUTH_URL" ]; then
            fail_start "$RUNNER_TEMP/dsh-web.log"
            exit 1
          fi
          printf '%s' "$AUTH_URL" > "$RUNNER_TEMP/dsh-auth-url"
          chmod 600 "$RUNNER_TEMP/dsh-auth-url"
      - name: Run Android panel browser E2E
        working-directory: deepseek-harness/apps/web
        env:
          DSH_AUTH_URL_FILE: ${{ runner.temp }}/dsh-auth-url
          DSH_ARTEMIS_E2E_ARTIFACT_DIR: ${{ runner.temp }}/dsh-artemis-e2e
          DSH_E2E_SESSION_CWD: ${{ github.workspace }}/dsh-artemis
        run: |
          cp "$GITHUB_WORKSPACE/dsh-artemis/test/e2e/native-panel.e2e.mjs" ./dsh-artemis-native-panel.e2e.mjs
          node "$GITHUB_WORKSPACE/dsh-artemis/scripts/run-e2e-redacted.mjs" ./dsh-artemis-native-panel.e2e.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-artemis-browser-e2e-failure
          path: ${{ runner.temp }}/dsh-artemis-e2e/native-panel-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop local test services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dsh-web.pid" ]; then kill "$(cat "$RUNNER_TEMP/dsh-web.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/fake-artemis.pid" ]; then kill "$(cat "$RUNNER_TEMP/fake-artemis.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/fake-deepseek.pid" ]; then kill "$(cat "$RUNNER_TEMP/fake-deepseek.pid")" 2>/dev/null || true; fi
