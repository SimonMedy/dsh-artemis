name: Temporary docs refresh through PR 104

on:
  push:
    branches:
      - gpt/phase-7-docs-through-104
    paths:
      - .github/workflows/temp-docs-through-104.yml
      - scripts/temp-patch-docs-through-104.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Refresh docs through PR 104
        run: |
          node scripts/temp-patch-docs-through-104.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md docs/release-readiness.md
          git commit -m "docs: refresh hardening evidence through PR 104"
          git push origin "HEAD:${GITHUB_REF_NAME}"
