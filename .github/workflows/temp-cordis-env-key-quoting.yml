name: Temporary Cordis env key quoting hardening

on:
  push:
    branches:
      - gpt/phase-7-cordis-env-key-quoting
    paths:
      - .github/workflows/temp-cordis-env-key-quoting.yml
      - scripts/temp-patch-cordis-env-key-quoting.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Quote Cordis environment keys
        run: |
          node scripts/temp-patch-cordis-env-key-quoting.mjs
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integration/artemis-mcp-config.mjs test/artemis-mcp-config.test.mjs
          git commit -m "fix: quote Cordis environment keys"
          git push origin "HEAD:${GITHUB_REF_NAME}"
