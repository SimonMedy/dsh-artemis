name: Temporary enable upstream HEAD compatibility probe

on:
  push:
    branches: [gpt/phase-7-upstream-head-probe]
    paths:
      - .github/workflows/temp-enable-upstream-head-probe.yml
      - scripts/temp-enable-upstream-head-probe.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
      - name: Patch official compatibility workflows for upstream HEADs
        run: |
          node scripts/temp-enable-upstream-head-probe.mjs
          git diff --check
      - name: Commit branch-only probe configuration
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/harness-compat.yml .github/workflows/artemis-compat.yml
          git commit -m "ci: probe current upstream compatibility heads"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:"$BRANCH"
