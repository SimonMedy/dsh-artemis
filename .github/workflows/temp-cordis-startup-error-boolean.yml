name: Temporary Cordis startup boolean hardening

on:
  push:
    branches:
      - gpt/phase-7-cordis-startup-error-boolean
    paths:
      - .github/workflows/temp-cordis-startup-error-boolean.yml
      - scripts/temp-patch-cordis-startup-error-boolean.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Harden Cordis startup error boolean
        run: |
          node scripts/temp-patch-cordis-startup-error-boolean.mjs
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integration/artemis-mcp-config.mjs test/artemis-mcp-config.test.mjs
          git commit -m "fix: reject malformed Cordis startup flags"
          git push origin "HEAD:${GITHUB_REF_NAME}"
