name: Temporary JSON read failure cleanup

on:
  push:
    branches:
      - gpt/phase-7-json-read-failure-cleanup
    paths:
      - .github/workflows/temp-json-read-failure-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Patch JSON read failure cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """      if (size > maxBytes) {
            try { await reader.cancel() } catch {}
            throw new ArtemisProtocolError(`${endpoint} response exceeded the configured size limit`, { code: 'response-too-large' })
          }
          chunks.push(value)
        }
      } finally {
        try { reader.releaseLock?.() } catch {}
      }"""
          new = """      if (size > maxBytes) {
            throw new ArtemisProtocolError(`${endpoint} response exceeded the configured size limit`, { code: 'response-too-large' })
          }
          chunks.push(value)
        }
      } catch (error) {
        try { await reader.cancel?.() } catch {}
        throw error
      } finally {
        try { reader.releaseLock?.() } catch {}
      }"""

          for name in ('src/host/artemis-http.mjs', 'src/host/artemis-evidence.mjs'):
              p = Path(name)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected one read loop, found {text.count(old)}')
              p.write_text(text.replace(old, new))

          host = Path('test/artemis-http-json-stream.test.mjs')
          host_text = host.read_text()
          marker = "test('Host JSON read failure cancels the reader and preserves the original error'"
          if marker in host_text:
              raise SystemExit('host regression already present')
          host.write_text(host_text + """

test('Host JSON read failure cancels the reader and preserves the original error', async () => {
  const readFailure = new Error('read failed')
  let cancelled = false
  let released = false
  const reader = {
    async read() { throw readFailure },
    cancel() {
      cancelled = true
      throw new Error('cancel failed')
    },
    releaseLock() { released = true },
  }
  const client = new ArtemisHttpClient({ fetchImpl: async () => responseWithReader(reader) })

  await assert.rejects(client.health(), (error) => error === readFailure)
  assert.equal(cancelled, true)
  assert.equal(released, true)
})
""")

          evidence = Path('test/artemis-evidence-json-stream.test.mjs')
          evidence_text = evidence.read_text()
          marker = "test('evidence JSON read failure cancels the reader and preserves the original error'"
          if marker in evidence_text:
              raise SystemExit('enidence regression already present')
          evidence.write_text(evidence_text + """

test('evidence JSON read failure cancels the reader and preserves the original error', async () => {
  const readFailure = new Error('read failed')
  let cancelled = false
  let released = false
  const reader = {
    async read() { throw readFailure },
    cancel() {
      cancelled = true
      return Promise.reject(new Error('cancel failed'))
    },
    releaseLock() { released = true },
  }

  await assert.rejects(
    getTaskStatus(evidenceClient(reader)),
    (error) => error === readFailure,
  )
  assert.equal(cancelled, true)
  assert.equal(released, true)
})
""")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-http.mjs src/host/artemis-evidence.mjs test/artemis-http-json-stream.test.mjs test/artemis-evidence-json-stream.test.mjs
          git commit -m "fix: clean up JSON stream read failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
