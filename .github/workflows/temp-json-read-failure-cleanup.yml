name: Temporary JSON read failure cleanup

on:
  push:
    branches:
      - gpt/phase-7-json-read-failure-cleanup
    paths:
      - .github/workflows/temp-json-read-failure-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Patch JSON read failure cleanup
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/artemis-http.mjs src/host/artemis-evidence.mjs test/artemis-http-json-stream.test.mjs test/artemis-evidence-json-stream.test.mjs
          git commit -m "fix: clean up JSON stream read failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
