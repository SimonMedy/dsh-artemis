name: Temporary browser JSON read cleanup

on:
  push:
    branches:
      - gpt/phase-7-browser-json-read-cleanup
    paths:
      - .github/workflows/temp-browser-json-read-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Patch and rebuild
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          npm run bundle:client
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/bounded-json.mjs test/bounded-json-release-lock.test.mjs lib/client.js
          git commit -m "fix: clean up browser JSON stream read failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
