name: Temporary browser JSON bundle rebuild

on:
  push:
    branches:
      - gpt/phase-7-browser-json-read-cleanup
    paths:
      - .github/workflows/temp-browser-json-read-cleanup.yml

permissions:
  contents: write

env:
  HARNESS_SHA: 0d1f50007f9bca3f52b06e1c3074fa14d5fb0720
  PNPM_VERSION: 11.7.0

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version
      - name: Install and build pinned Harness
        run: |
          run_quiet() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/${name}.log"
            if ! "$@" > "$log" 2>&1; then
              echo "::error title=${name} failed::Raw upstream output suppressed; see bounded summary"
              node "$GITHUB_WORKSPACE/scripts/summarize-harness-log.mjs" "$log" build
              exit 1
            fi
          }
          run_quiet harness-install pnpm --dir deepseek-harness install --frozen-lockfile
          run_quiet harness-build pnpm --dir deepseek-harness run build
      - name: Rebuild checked browser client
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
        run: |
          npm run bundle:client
          git diff --exit-code -- src/client/bounded-json.mjs test/bounded-json-release-lock.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js
          git diff --cached --quiet && { echo "::error::Expected lib/client.js to change"; exit 1; }
          git commit -m "build: refresh browser client bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
