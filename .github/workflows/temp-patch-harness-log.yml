name: TEMP patch DeepSeek Harness logs

on:
  push:
    branches:
      - gpt/phase-7-harness-log-summary-final
    paths:
      - .github/workflows/temp-patch-harness-log.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: dsh-artemis
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Escape temporary shell placeholders in patcher checkout
        working-directory: dsh-artemis
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const file = '.github/temp/patch-harness-log-workflow.mjs'
          let source = await readFile(file, 'utf8')
          const targets = [
            ['$RUNNER_TEMP/${name}.log', '$RUNNER_TEMP/\\${name}.log'],
            ['title=${name} failed', 'title=\\${name} failed'],
          ]
          for (const [before, after] of targets) {
            const count = source.split(before).length - 1
            if (count !== 2) throw new Error(`Expected exactly two ${before} placeholders, found ${count}`)
            source = source.split(before).join(after)
          }
          await writeFile(file, source)
          NODE
      - name: Apply exact DeepSeek Harness log patch atomically
        working-directory: dsh-artemis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: node .github/temp/patch-harness-log-workflow.mjs
