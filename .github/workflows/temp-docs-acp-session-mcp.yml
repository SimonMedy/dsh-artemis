name: Temporary ACP session MCP docs

on:
  push:
    branches:
      - gpt/phase-5-acp-session-mcp-config
    paths:
      - .github/workflows/temp-docs-acp-session-mcp.yml
      - scripts/temp-docs-acp-session-mcp.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Update ACP MCP documentation
        run: node scripts/temp-docs-acp-session-mcp.mjs
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/mcp-integration.md
          git commit -m "docs: document ACP session-scoped ARTEMIS MCP config"
          git push origin "HEAD:${GITHUB_REF_NAME}"
