name: Temporary browser snapshot read cleanup

on:
  push:
    branches:
      - gpt/phase-7-browser-snapshot-read-cleanup
    paths:
      - .github/workflows/temp-browser-snapshot-read-cleanup.yml
      - scripts/temp-patch-browser-snapshot.mjs

permissions:
  contents: write

env:
  HARNESS_SHA: 0d1f50007f9bca3f52b06e1c3074fa14d5fb0720
  PNPM_VERSION: 11.7.0

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Build pinned Harness and patch
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir deepseek-harness install --frozen-lockfile >/tmp/harness-install.log 2>&1 || { node scripts/summarize-harness-log.mjs /tmp/harness-install.log build; exit 1; }
          pnpm --dir deepseek-harness run build >/tmp/harness-build.log 2>&1 || { node scripts/summarize-harness-log.mjs /tmp/harness-build.log build; exit 1; }
          node scripts/temp-patch-browser-snapshot.mjs
          npm run bundle:client
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/snapshot.mjs test/client-snapshot-stream.test.mjs lib/client.js
          git commit -m "fix: clean up browser snapshot stream read failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
