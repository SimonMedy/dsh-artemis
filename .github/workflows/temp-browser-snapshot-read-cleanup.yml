name: Temporary browser snapshot read cleanup

on:
  push:
    branches:
      - gpt/phase-7-browser-snapshot-read-cleanup
    paths:
      - .github/workflows/temp-browser-snapshot-read-cleanup.yml

permissions:
  contents: write

env:
  HARNESS_SHA: 0d1f50007f9bca3f52b06e1c3074fa14d5fb0720
  PNPM_VERSION: 11.7.0

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dsh-artemis
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install and build pinned Harness
        run: |
          pnpm --dir deepseek-harness install --frozen-lockfile >/tmp/harness-install.log 2>&1 || { node scripts/summarize-harness-log.mjs /tmp/harness-install.log build; exit 1; }
          pnpm --dir deepseek-harness run build >/tmp/harness-build.log 2>&1 || { node scripts/summarize-harness-log.mjs /tmp/harness-build.log build; exit 1; }
      - name: Patch snapshot cleanup and rebuild bundle
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_SHA: ${{ env.HARNESS_SHA }}
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/client/snapshot.mjs')
          text = source.read_text()
          old = '''  try {
    while (true) {
      const { value, done } = await reader.read()
      if (done) break
      if (!(value instanceof Uint8Array)) throw new Error('Android snapshot returned an invalid response body')
      size += value.byteLength
      if (size > maxBytes) {
        try { await reader.cancel() } catch {}
        throw new Error('Android snapshot exceeded the browser size limit')
      }
      chunks.push(value)
    }
  } finally {
    try { reader.releaseLock?.() } catch {}
  }'''
          new = '''  try {
    while (true) {
      const { value, done } = await reader.read()
      if (done) break
      if (!(value instanceof Uint8Array)) throw new Error('Android snapshot returned an invalid response body')
      size += value.byteLength
      if (size > maxBytes) {
        throw new Error('Android snapshot exceeded the browser size limit')
      }
      chunks.push(value)
    }
  } catch (error) {
    try { await reader.cancel?.() } catch {}
    throw error
  } finally {
    try { reader.releaseLock?.() } catch {}
  }'''
          if text.count(old) != 1:
              raise SystemExit(f'snapshot loop count: {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('test/client-snapshot-stream.test.mjs')
          text = test.read_text()
          marker = "test('snapshot rejects non-Uint8Array stream chunks before size accounting'"
          if text.count(marker) != 1:
              raise SystemExit(f'snapshot test marker count: {text.count(marker)}')
          addition = '''test('snapshot read failure cancels the reader and preserves the original error', async () => {
  const readFailure = new Error('read failed')
  let cancelled = false
  let released = false
  const reader = {
    async read() { throw readFailure },
    cancel() {
      cancelled = true
      return Promise.reject(new Error('cancel failed'))
    },
    releaseLock() { released = true },
  }
  await assert.rejects(
    fetchSnapshot({ locationLike, fetchImpl: async () => responseWithReader(reader) }),
    (error) => error === readFailure,
  )
  assert.equal(cancelled, true)
  assert.equal(released, true)
})

test('snapshot invalid chunk cancels the reader without masking the protocol error', async () => {
  let cancelled = false
  let released = false
  const reader = {
    async read() { return { done: false, value: 'not-bytes' } },
    cancel() {
      cancelled = true
      throw new Error('cancel failed synchronously')
    },
    releaseLock() { released = true },
  }
  await assert.rejects(
    fetchSnapshot({ locationLike, fetchImpl: async () => responseWithReader(reader) }),
    /invalid response body/,
  )
  assert.equal(cancelled, true)
  assert.equal(released, true)
})

'''
          test.write_text(text.replace(marker, addition + marker))
          PY
          npm run bundle:client
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/snapshot.mjs test/client-snapshot-stream.test.mjs lib/client.js
          git commit -m "fix: clean up browser snapshot stream read failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
