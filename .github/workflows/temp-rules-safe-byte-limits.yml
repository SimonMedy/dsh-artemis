name: Temporary rules safe byte limits hardening

on:
  push:
    branches:
      - gpt/phase-7-rules-safe-byte-limits
    paths:
      - .github/workflows/temp-rules-safe-byte-limits.yml
      - scripts/temp-patch-rules-safe-byte-limits.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Harden rules byte limits
        run: |
          node scripts/temp-patch-rules-safe-byte-limits.mjs
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integration/artemis-rules-skill.mjs src/integration/rules-skill-plugin.mjs test/artemis-rules-skill.test.mjs test/rules-skill-plugin.test.mjs
          git commit -m "fix: require safe rules byte limits"
          git push origin "HEAD:${GITHUB_REF_NAME}"
